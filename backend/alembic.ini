# backend/alembic.ini
# Configuración de Alembic. La URL de la base de datos NO va aquí: se lee desde las
# variables de entorno en migrations/env.py para no versionar secretos.

[alembic]
# Carpeta de migraciones.
script_location = migrations
# Permite importar "app" al ejecutar alembic desde la carpeta backend/.
prepend_sys_path = .
# Separador de rutas del sistema operativo (evita una advertencia de Alembic).
path_separator = os
# Nombre de archivo ordenado por fecha para cada migración.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Registro de eventos de Alembic en consola.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S